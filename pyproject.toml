[project]
name = "adk-ikea-brand-analysis"
version = "0.1.0"
description = "Multi-Agent Brand Search Optimization and Product Title Enrichment System for IKEA using Google ADK and Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AI Engineer" }
]
keywords = [
    "agentic-ai",
    "google-adk",
    "gemini",
    "multi-agent-systems",
    "brand-optimization",
    "ecommerce-seo",
    "reflection-pattern"
]

dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.10.0",
    "google-cloud-storage>=2.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
