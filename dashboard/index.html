                const queryTokens = searchQuery.toLowerCase().replace(/[^a-z0-9]/g, ' ').split(/\s+/).filter(t => t.length > 1 && !stopWords.has(t));
                
                if (queryTokens.length === 0) return { score: 0, matched: [], missing: [] };

                    selectedProduct.name + " " +
                    selectedProduct.layers.l2_seo.tag + " " +
                    selectedProduct.layers.l3_synonyms.join(" ") + " " +
                    selectedProduct.layers.l4_feed.title + " " +
                    selectedProduct.dimensions + " " +
                    selectedProduct.color
                ).toLowerCase();

                const matched = queryTokens.filter(t => allMetaText.includes(t));
                const missing = queryTokens.filter(t => !allMetaText.includes(t));
                const score = Math.round((matched.length / queryTokens.length) * 100);

                return { score, matched, missing, total: queryTokens.length };

                                        <div className="border border-slate-200 rounded-xl p-6 bg-slate-50/50 max-w-lg">
                                            <div className="text-2xl font-bold text-slate-900">{selectedProduct.layers.l1_ui.title}</div>
                                            <div className="text-sm font-medium text-slate-600 mt-1">{selectedProduct.layers.l1_ui.subtitle}</div>
                                            <div className="text-lg font-extrabold text-slate-900 mt-3">{selectedProduct.price}</div>
                                            <div className="text-xs text-slate-500 mt-2 line-clamp-2">{selectedProduct.description}</div>
                                        </div>
                                        <p className="text-xs text-slate-600 italic">💡 {selectedProduct.layers.l1_ui.note}</p>
                                    </div>
                                )}

                                {activeLayer === 2 && (
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Technical SEO HTML Title Tag (Google Search SERP Preview)</span>
                                            <span className="text-xs bg-emerald-50 text-emerald-700 font-semibold px-2.5 py-0.5 rounded border border-emerald-100">Rankings Optimized</span>
                                        </div>
                                        <div className="border border-slate-200 rounded-xl p-5 bg-white max-w-2xl">
                                            <div className="text-xs text-slate-600">https://www.ikea.com &gt; us &gt; en &gt; products &gt; {selectedProduct.id.toLowerCase()}</div>
                                            <div className="text-lg font-medium text-blue-800 hover:underline cursor-pointer mt-0.5">
                                                {selectedProduct.layers.l2_seo.tag}
                                            </div>
                                            <div className="text-xs text-slate-600 mt-1">
                                                {selectedProduct.layers.l2_seo.meta}
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-600 italic">💡 {selectedProduct.layers.l2_seo.note}</p>
                                    </div>
                                )}

                                {activeLayer === 3 && (
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Internal Search Engine Synonyms (Algolia / Elasticsearch Query Expansion)</span>
                                            <span className="text-xs bg-purple-50 text-purple-700 font-semibold px-2.5 py-0.5 rounded border border-purple-100">Zero-Result Elimination</span>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {selectedProduct.layers.l3_synonyms.map((syn, idx) => (
                                                <span key={idx} className="bg-slate-100 border border-slate-300 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                                                    🔍 {syn}
                                                </span>
                                            ))}
                                        </div>
                                        <p className="text-xs text-slate-600 italic">💡 When shoppers type any of these phrases on IKEA.com, {selectedProduct.name} is returned #1 without changing the visual display title.</p>
                                    </div>
                                )}

                                {activeLayer === 4 && (
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Marketplace & Shopping Feed Syndication (Google Merchant Center & Amazon)</span>
                                            <span className="text-xs bg-amber-50 text-amber-800 font-semibold px-2.5 py-0.5 rounded border border-amber-200">High Attribute Density</span>
                                        </div>
                                        <div className="bg-slate-900 text-slate-100 p-4 rounded-xl font-mono text-xs overflow-x-auto">
                                            <div><span className="text-slate-400">Title:</span> {selectedProduct.layers.l4_feed.title}</div>
                                            <div className="mt-1"><span className="text-slate-400">Category:</span> {selectedProduct.layers.l4_feed.category}</div>
                                            <div className="mt-1"><span className="text-slate-400">Target Channel:</span> Google Shopping, Performance Max, Wayfair, Amazon</div>
                                        </div>
                                        <p className="text-xs text-slate-600 italic">💡 {selectedProduct.layers.l4_feed.note}</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Live Search Engine Simulator */}
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                <div>
                                    <h3 className="text-base font-bold text-slate-800">🔍 Live Search Engine Simulator & Token Recall Checker</h3>
                                    <p className="text-xs text-slate-500">Test any search phrase against the active product metadata to see real-time token recall scoring.</p>
                                </div>
                                <div className="text-right">
                                    <span className="text-xs font-bold text-slate-500">Match Score: </span>
                                    <span className={`text-lg font-black ${simResults.score >= 70 ? "text-emerald-600" : "text-amber-600"}`}>
                                        {simResults.score}%
                                    </span>
                                </div>
                            </div>

                            <div className="flex gap-2">
                                <input 
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Type a shopper search phrase (e.g. 79 inch white bookcase)..."
                                    className="flex-1 px-4 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-ikea-blue focus:border-transparent font-medium"
                                />
                                <button 
                                    onClick={() => setSearchQuery("79 inch tall white bookshelf with adjustable shelves")}
                                    className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition"
                                >
                                    Reset Example
                                </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-lg">
                                    <div className="font-bold text-emerald-800 mb-1">✓ Matched Tokens ({simResults.matched.length}):</div>
                                    <div className="flex flex-wrap gap-1">
                                        {simResults.matched.length > 0 ? (
                                            simResults.matched.map((t, idx) => (
                                                <span key={idx} className="bg-emerald-200/80 text-emerald-900 px-2 py-0.5 rounded font-mono font-semibold">
                                                    {t}
                                                </span>
                                            ))
                                        ) : (
                                            <span className="text-emerald-600 italic">No tokens matched yet.</span>
                                        )}
                                    </div>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 p-3 rounded-lg">
                                    <div className="font-bold text-slate-600 mb-1">Missing Tokens ({simResults.missing.length}):</div>
                                    <div className="flex flex-wrap gap-1">
                                        {simResults.missing.length > 0 ? (
                                            simResults.missing.map((t, idx) => (
                                                <span key={idx} className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-mono">
                                                    {t}
                                                </span>
                                            ))
                                        ) : (
                                            <span className="text-slate-500 italic">None (100% token coverage).</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Schema.org & Merchant Feed Code Inspector */}
                        <div className="bg-slate-900 text-slate-100 rounded-xl p-6 shadow-md space-y-3">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h3 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                                        <span>🏷️</span> Schema.org/Product JSON-LD (Google Rich Snippet Generator)
                                    </h3>
                                    <p className="text-xs text-slate-400 mt-0.5">Compliant structured data ready for Next.js / frontend &lt;head&gt; injection.</p>
                                </div>
                                <button 
                                    onClick={copyJsonToClipboard}
                                    className="px-3 py-1.5 bg-ikea-blue hover:bg-blue-600 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1"
                                >
                                    {copiedJson ? "✓ Copied!" : "📋 Copy JSON-LD"}
                                </button>
                            </div>
                            <pre className="bg-slate-950 p-4 rounded-lg text-xs font-mono text-emerald-400 overflow-x-auto max-h-60 border border-slate-800">
                                {jsonLdCode}
                            </pre>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500">
                        Built with <strong>Google Agent Development Kit (ADK)</strong> &bull; <strong>Gemini 2.5 Flash</strong> &bull; React & Highcharts Full-Stack Architecture
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
